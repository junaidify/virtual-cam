<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VirtualCam — Test Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0b0d13;
      color: #f0f0f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      min-height: 100vh;
    }
    h1 {
      font-size: 28px;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .subtitle { color: #8b8fa3; margin-bottom: 32px; font-size: 14px; }
    .video-container {
      width: 640px;
      max-width: 90vw;
      aspect-ratio: 4/3;
      background: #1a1a2e;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(139, 92, 246, 0.3);
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge.live { background: rgba(34,197,94,0.2); color: #22c55e; }
    .badge.spoofed { background: rgba(139,92,246,0.2); color: #8b5cf6; }
    .badge.error { background: rgba(239,68,68,0.2); color: #ef4444; }
    .btn {
      margin-top: 24px;
      padding: 12px 32px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { filter: brightness(1.15); transform: scale(1.02); }
    .log {
      margin-top: 24px;
      width: 640px;
      max-width: 90vw;
      background: #1a1a2e;
      border-radius: 12px;
      padding: 16px;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
      line-height: 1.8;
    }
    .log-entry { color: #8b8fa3; }
    .log-entry.success { color: #22c55e; }
    .log-entry.warn { color: #f59e0b; }
    .log-entry.error { color: #ef4444; }
    .log-entry.info { color: #8b5cf6; }
  </style>
</head>
<body>
  <h1>📷 VirtualCam Test Page</h1>
  <p class="subtitle">Click the button below to test if the virtual feed is working</p>

  <div class="video-container">
    <video id="video" autoplay playsinline muted></video>
    <div class="badge" id="badge" style="display:none;"></div>
  </div>

  <button class="btn" id="startBtn">Start Camera</button>

  <div class="log" id="log"></div>

  <script>
    const video = document.getElementById('video');
    const badge = document.getElementById('badge');
    const startBtn = document.getElementById('startBtn');
    const logEl = document.getElementById('log');

    function log(msg, type = '') {
      const entry = document.createElement('div');
      entry.className = 'log-entry ' + type;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logEl.prepend(entry);
    }

    // Check if VirtualCam data is in localStorage
    const hasImage = !!localStorage.getItem('__virtualcam_image');
    const isEnabled = localStorage.getItem('__virtualcam_enabled');

    log('VirtualCam enabled: ' + isEnabled, isEnabled === 'true' ? 'success' : 'warn');
    log('VirtualCam image loaded: ' + hasImage, hasImage ? 'success' : 'warn');

    if (!hasImage || isEnabled !== 'true') {
      log('⚠️  Upload an image via the VirtualCam popup and refresh this page!', 'warn');
    } else {
      log('✅ VirtualCam is ready — click Start Camera to test', 'success');
    }

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      startBtn.textContent = 'Starting...';
      log('Calling navigator.mediaDevices.getUserMedia({ video: true })...', 'info');

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        log('✅ Got MediaStream with ' + stream.getTracks().length + ' track(s)', 'success');

        const videoTrack = stream.getVideoTracks()[0];
        if (videoTrack) {
          const settings = videoTrack.getSettings();
          log('Video track: ' + videoTrack.label, 'info');
          log('Resolution: ' + (settings.width || '?') + 'x' + (settings.height || '?'), 'info');

          // If the track label is empty or contains 'canvas', it's likely spoofed
          if (!videoTrack.label || videoTrack.label === '' || videoTrack.label.includes('canvas')) {
            badge.textContent = '🎭 SPOOFED';
            badge.className = 'badge spoofed';
            log('🎯 Stream appears to be SPOOFED (no camera label detected)', 'success');
          } else {
            badge.textContent = '📹 LIVE CAMERA';
            badge.className = 'badge live';
            log('⚠️  Stream appears to be REAL camera: ' + videoTrack.label, 'warn');
          }
          badge.style.display = 'block';
        }

        startBtn.textContent = 'Camera Running';
      } catch (err) {
        log('❌ Error: ' + err.message, 'error');
        badge.textContent = '❌ ERROR';
        badge.className = 'badge error';
        badge.style.display = 'block';
        startBtn.textContent = 'Try Again';
        startBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
